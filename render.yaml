services:
  - type: web
    name: goldenhour
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: '*'
      - key: SIMULATION_MODE
        value: 'true'
